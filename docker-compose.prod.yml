version: "3.9"

services:
  api-gateway:
    image: ghcr.io/innovatecodefactory/marquei-api-gateway:latest
    container_name: api-gateway
    restart: always
    init: true
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    env_file: .env
    networks:
      - rabbit_external_network
      - redis_external_network

  messaging:
    image: ghcr.io/innovatecodefactory/marquei-messaging:latest
    container_name: messaging
    restart: always
    init: true
    environment:
      - PORT=3001
    env_file: .env
    networks:
      - rabbit_external_network
      - redis_external_network

  payment:
    image: ghcr.io/innovatecodefactory/marquei-payment:latest
    container_name: payment
    restart: always
    init: true
    environment:
      - PORT=3002
    env_file: .env
    networks:
      - rabbit_external_network
      - redis_external_network

  scheduler:
    image: ghcr.io/innovatecodefactory/marquei-scheduler:latest
    container_name: scheduler
    restart: always
    init: true
    environment:
      - PORT=3003
    env_file: .env
    networks:
      - rabbit_external_network
      - redis_external_network

  # `prisma migrate deploy`: so roda sob demanda (profile "migrate"), via
  # `docker compose --profile migrate run --rm migrator` em run/prod-up.sh.
  # Usa o mesmo .env (DATABASE_URL de producao) e as mesmas redes dos apps.
  migrator:
    image: ghcr.io/innovatecodefactory/marquei-migrator:${MIGRATOR_TAG:-latest}
    profiles: ["migrate"]
    restart: "no"
    env_file: .env
    networks:
      - rabbit_external_network
      - redis_external_network

networks:
  rabbit_external_network:
    external: true
  redis_external_network:
    external: true
